<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Manipulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ส่วนหัวเว็บไซต์ -->
    <header class="navbar">
        <div class="logo">
            THE MANIPULATOR
        </div>

        <nav>
            <a href="#">หน้าแรก</a>
            <a href="#">วิธีเล่น</a>
            <a href="#">เกี่ยวกับเกม</a>
        </nav>

        <button id="loginBtn">
            เข้าสู่ระบบ
        </button>
    </header>

    <!-- เนื้อหาหลัก -->
    <main class="hero">

        <section class="hero-content">

            <p class="subtitle">
                THE ART OF DECEPTION
            </p>

            <h1>
                จงตามหาคำตอบให้เจอ<br>
                และอย่าลืมว่ามีใครบางคนคอยชักจูงพวกคุณอยู่
            </h1>

            <p class="description">
                ร่วมไขปริศนา ค้นหาคำตอบ
                และตามหาผู้บงการที่ซ่อนตัวอยู่ในกลุ่มของพวกคุณ
            </p>

            <div class="hero-buttons">
                <button id="createRoomBtn">
                    สร้างห้องเกม
                </button>

                <button id="joinRoomBtn">
                    เข้าร่วมห้อง
                </button>
            </div>

        </section>

        <section class="hero-decoration">
            <div class="case-card">
                <p>CLASSIFIED CASE</p>
                <h2>CASE #001</h2>
                <span>THE UNKNOWN</span>
            </div>
        </section>

    </main>

    <!-- ส่วนท้าย -->
    <footer>
        THE MANIPULATOR © 2026
        <span>EVERYONE HAS SOMETHING TO HIDE.</span>
    </footer>

    <!-- 1. โหลด Discord Embedded App SDK (อัปเดตเป็น v1.1.0) -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.1.0/dist/index.global.js"></script>

    <!-- 2. โหลดไฟล์ app.js (ลบ type="module" ออกเพื่อให้ใช้ window.DiscordSDK ได้) -->
    <script src="js/app.js"></script>

</body>
</html>
